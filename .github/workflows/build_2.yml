name: Build Mi 6 Kernel Plain

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/android_kernel_xiaomi_MI6
          ref: lineage-22.2
          path: kernel-source

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev ccache zip lzop cpio libelf-dev

      - name: Download Toolchain (AOSP Clang r536225)
        run: |
          mkdir -p toolchain/clang
          cd toolchain
          # Clone commit spesifik r536225
          git init clang_tmp
          cd clang_tmp
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git fetch --depth 1 origin b3a530ec6537146650e42be89f1089e9a3588460
          git checkout FETCH_HEAD
          # Pindahkan isi folder clang-r536225 ke toolchain/clang
          cp -r clang-r536225/* ../clang/
          cd .. && rm -rf clang_tmp
      
      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Defconfig standar sagit/msm8998
          make O=out xiaomi/mi8998_defconfig
          make -j$(nproc --all) O=out

      - name: Check Output
        run: |
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel successfully compiled!"
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            echo "Kernel Image.gz built!"
          else
            echo "Kernel build failed or binary is in a different path."
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi6-Kernel-Lineage22.2
          path: |
            kernel-source/out/arch/arm64/boot/Image*
            kernel-source/out/arch/arm64/boot/dts/qcom/*.dtb
