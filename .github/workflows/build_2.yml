name: Build Mi 6 Kernel Plain

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/android_kernel_xiaomi_MI6
          ref: lineage-22.2
          path: kernel-source

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev ccache zip lzop cpio libelf-dev libdebuginfod1

      - name: Download Toolchain (AOSP Clang r536225)
        run: |
          mkdir -p toolchain
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang-src
          cd toolchain/clang-src
          git sparse-checkout init --cone
          git sparse-checkout set clang-r536225
          git checkout main
          cd ../..
          mv toolchain/clang-src/clang-r536225 toolchain/clang
          rm -rf toolchain/clang-src

      - name: Download GCC Cross-Toolchains (arm64 + arm32)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchain/gcc-arm64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchain/gcc-arm32

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../toolchain/clang/bin:$(pwd)/../toolchain/gcc-arm64/bin:$(pwd)/../toolchain/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-elf-
          export CROSS_COMPILE_ARM32=arm-eabi-

          grep -i "CONFIG_FB_MSM_MDSS" kernel-source/out/.config

          make O=out vendor/xiaomi/mi8998_defconfig

          # Matiin ACPI yang otomatis kepicu dari dependency Kconfig lain
          ./scripts/config --file out/.config --disable CONFIG_ACPI
          make O=out olddefconfig

          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration"
    
      - name: Check Output
        run: |
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel successfully compiled!"
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            echo "Kernel Image.gz built!"
          else
            echo "Kernel build failed or binary is in a different path."
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi6-Kernel-Lineage22.2
          path: |
            kernel-source/out/arch/arm64/boot/Image*
            kernel-source/out/arch/arm64/boot/dts/qcom/*.dtb
