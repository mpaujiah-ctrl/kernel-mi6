name: Build Kernel MI6 (KSUN)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/mpaujiah-ctrl/android_kernel_xiaomi_msm8998
  KERNEL_BRANCH: lineage-22.2
  DEFCONFIG: sagit_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python-is-python3 zip

      - name: Clone kernel source
        run: git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel

      - name: Get Clang (via AOSP Gitiles tarball, sama metode kayak cepheus)
        run: |
          mkdir -p toolchain/clang
          curl -Ls "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r28/clang-r383902b.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang

      - name: Setup KernelSU-Next (manual hook mode)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          # matikan kprobe hook, paksa manual hook — wajib buat kernel 4.4 non-GKI
          find KernelSU-Next -type f -name '*.c' -exec \
            sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Enable KSU config di defconfig
        working-directory: kernel
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          make O=out ARCH=${{ env.ARCH }} -j$(nproc) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-msm8998-ksun
          path: kernel/out/arch/arm64/boot/Image*
